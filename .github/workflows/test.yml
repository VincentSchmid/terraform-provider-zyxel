name: test

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: test -z "$(gofmt -l -s .)"

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # Unit and encrypted mock-router tests only; TF_ACC is intentionally unset.
      - name: Test And Enforce Architecture
        run: go test -race ./...
