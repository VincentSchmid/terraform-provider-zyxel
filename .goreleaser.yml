# GoReleaser configuration for Terraform Registry releases.
# Local release: GPG_FINGERPRINT=<key id> GITHUB_TOKEN=<token> goreleaser release --clean
# CI release:   push a semver tag such as v0.1.0 (see .github/workflows/release.yml)
version: 2

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags:
      - -trimpath
    ldflags:
      - "-s -w -X main.version={{.Version}} -X main.commit={{.Commit}}"
    goos:
      - freebsd
      - windows
      - linux
      - darwin
    goarch:
      - amd64
      - "386"
      - arm
      - arm64
    ignore:
      - goos: darwin
        goarch: "386"
    # The registry requires this binary name inside each archive.
    binary: "{{ .ProjectName }}_v{{ .Version }}"

archives:
  - formats: [zip]
    # terraform-provider-zyxel_<version>_<os>_<arch>.zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  # terraform-provider-zyxel_<version>_SHA256SUMS
  name_template: "{{ .ProjectName }}_{{ .Version }}_SHA256SUMS"
  algorithm: sha256
  extra_files:
    # terraform-provider-zyxel_<version>_manifest.json, from the repo manifest.
    - glob: "terraform-registry-manifest.json"
      name_template: "{{ .ProjectName }}_{{ .Version }}_manifest.json"

signs:
  # GPG signature of the checksums; the registry verifies it against your key.
  - artifacts: checksum
    args:
      - "--batch"
      - "--local-user"
      - "{{ .Env.GPG_FINGERPRINT }}"
      - "--output"
      - "${signature}"
      - "--detach-sign"
      - "${artifact}"

release:
  # Publish the draft by hand after checking the assets and signature.
  draft: true

changelog:
  disable: true
